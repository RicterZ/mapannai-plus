">花见小路</text><text x="1202" y="929" font-size="10" fill="#8a939b" font-weight="400">尚无访问顺序</text><text x="40" y="1034" font-size="19" fill="#262a30" font-weight="600">这次不只是去边框</text><text x="40" y="1065" font-size="14" fill="#64717b" font-weight="400">旅途详情用「日期章节 + 路线预览」，不把当天地点混成一串；日详情用访问序号串联，图标承担地点辨识。</text><text x="40" y="1094" font-size="14" fill="#64717b" font-weight="400">右侧只放计划时间，访问备注跟随地点，交通位于两次访问之间；保留左侧距离与居中向下箭头。</text><text x="40" y="1127" font-size="12" fill="#87919a" font-weight="400">静态评审稿 · 无照片示例 · 正式实现保留已有封面缩略图、编辑与拖动能力 · 尚未修改业务代码</text></svg>